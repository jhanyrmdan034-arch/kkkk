plugins {
    id 'com.android.application'
}

android {
    namespace 'com.telegramUIkit.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.telegramUIkit.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external dependencies — framework WebView only, so the build stays small and reliable.
}
