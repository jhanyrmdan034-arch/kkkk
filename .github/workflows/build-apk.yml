name: Build APK

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Telegram-UI-Kit.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-UI-Kit-apk
          path: Telegram-UI-Kit.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Telegram iOS UI Kit APK (build ${{ github.run_number }})
          body: |
            Installable debug APK with the Telegram iOS UI Kit appearance rebuilt from the user-supplied screenshots.
            Download `Telegram-UI-Kit.apk` below and open it on your Android phone to install.
            If the previous build is already installed and Android refuses the update, uninstall the old build first (debug builds may be signed by a different runner key).
          files: Telegram-UI-Kit.apk
